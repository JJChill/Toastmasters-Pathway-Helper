# Publishes ONLY the guide (guide/pathways-guide.html + guide/img/) to GitHub Pages.
# The cheat sheet, extension and source are deliberately not part of the site.
name: Publish guide to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['guide/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the site (guide only)
        run: |
          mkdir _site
          cp guide/pathways-guide.html _site/index.html
          cp -r guide/img _site/img
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
